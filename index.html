<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA | Explore the Cosmos</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <img src="https://www.nasa.gov/wp-content/themes/nasa/assets/images/nasa-logo.svg" class="logo" alt="NASA">
        <ul class="nav-links">
            <li><a href="#">Missions</a></li>
            <li><a href="#">Galleries</a></li>
            <li><a href="#">NASA TV</a></li>
        </ul>
        <button class="btn-search"><i class="fas fa-search"></i></button>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h4 class="fade-in">Space Exploration</h4>
            <h1 class="slide-up">TO THE MOON AND MARS</h1>
            <p>NASA is exploring the secrets of the universe for the benefit of all.</p>
            <div class="hero-btns">
                <a href="#" class="btn-primary">Latest News</a>
                <a href="#" class="btn-secondary">Watch Live</a>
            </div>
        </div>
    </header>

    <section class="stats-bar">
        <div class="stat-item">
            <span>2,500+</span>
            <p>Active Satellites</p>
        </div>
        <div class="stat-item">
            <span>12</span>
            <p>Moon Walkers</p>
        </div>
        <div class="stat-item">
            <span>400km</span>
            <p>ISS Altitude</p>
        </div>
    </section>

</body>
</html>
